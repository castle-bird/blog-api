services:
  postgres:
    image: postgres:17
    container_name: castle-bird-blog-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: castlebird
    mem_limit: 200m
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: [ "sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 64mb --maxmemory-policy allkeys-lru" ]
    container_name: castle-bird-blog-redis
    restart: unless-stopped
    env_file:
      - .env
    mem_limit: 100m
    volumes:
      - redis-data:/data

  app:
    image: ghcr.io/castle-bird/blog-api:latest
    container_name: castle-bird-blog-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -Xmx384m
    mem_limit: 480m
    volumes:
      - upload-data:/data/uploads
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: castle-bird-blog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

volumes:
  postgres-data:
  redis-data:
  upload-data:
