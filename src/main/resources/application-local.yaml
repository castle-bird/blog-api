spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/castlebird
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: localhost

app:
  security:
    allowed-origins: http://localhost:3000
    cookie-secure: false
  upload:
    base-path: ./uploads
    base-url: http://localhost:8080/images
