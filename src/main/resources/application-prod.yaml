spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/castlebird
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}

app:
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    cookie-secure: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
