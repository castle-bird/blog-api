spring:
  application:
    name: castle-bird-blog

  jackson:
    time-zone: UTC

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/seed
    schemas: blog
    create-schemas: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: blog
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      port: 6379
      password: ${REDIS_PASSWORD}

  cache:
    type: redis
    redis:
      time-to-live: 10m

app:
  jwt:
    access-token-expiration: 15m
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
  security:
    refresh-token-expiration: 14d
    cookie-name: REFRESH-TOKEN
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
    email: ${ADMIN_EMAIL}
    nickname: ${ADMIN_NICKNAME}
