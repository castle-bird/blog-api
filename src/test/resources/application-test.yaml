spring:
  datasource:
    url: jdbc:h2:mem:castlebird;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: PUBLIC

  cache:
    type: simple

app:
  jwt:
    access-token-expiration: 15m
    secret: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
    issuer: test-issuer
  security:
    allowed-origins:
      - http://localhost
    refresh-token-expiration: 14d
    cookie-name: REFRESH-TOKEN
    cookie-secure: false
