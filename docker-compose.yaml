services:
  postgres:
    image: postgres:17
    container_name: castle-bird-blog-db
    restart: unless-stopped
    env_file:
      - .env.postgres
    environment:
      POSTGRES_DB: castlebird
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: [ "sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\"" ]
    container_name: castle-bird-blog-redis
    restart: unless-stopped
    env_file:
      - .env.redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
