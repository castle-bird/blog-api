# 로그인 요청 횟수를 제한하는 zone 선언
# 목적: 무차별 로그인 시도(brute force) 차단
# $binary_remote_addr = 클라이언트 IP 기준으로 카운트, 10m = zone 저장 공간 크기
# rate=5r/m = IP당 1분에 5회까지 허용
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
# 제한 초과 시 기본 503 대신 429(Too Many Requests) 반환
limit_req_status 429;

# 이 도메인으로 80(HTTP) 요청이 오면 전부 443(HTTPS)로 리다이렉트
server {
    listen 80;
    server_name castlebird-api.duckdns.org;
    return 301 https://$host$request_uri;
}

# 실제 TLS 처리 + 리버스 프록시 서버
server {
    listen 443 ssl;
    server_name castlebird-api.duckdns.org;

    # certbot이 발급한 인증서 경로 (docker-compose에서 /etc/letsencrypt를 그대로 마운트)
    ssl_certificate     /etc/letsencrypt/live/castlebird-api.duckdns.org/fullchain.pem; # 서버 인증서
    ssl_certificate_key /etc/letsencrypt/live/castlebird-api.duckdns.org/privkey.pem;   # 비밀키 (절대 노출 금지)

    # 로그인 경로만 정확히 매칭(exact match)해서 rate limit 적용
    # burst=3 nodelay = 순간적으로 3개까지는 대기 없이 통과, 그 이상은 즉시 429
    location = /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://app:8080;
        proxy_set_header Host $host; # 클라가 어떤 도메인으로 요청 보냈는가? →  예시: castlebird-api.duckdns.org
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 클라의 실제 IP는?
        proxy_set_header X-Forwarded-Proto $scheme; # 클라의 요청이 http or https 중 무엇이였는가?
    }

    # 그 외 모든 요청은 rate limit 없이 그대로 app으로 프록시
    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
