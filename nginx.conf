server {
    listen 80;
    server_name castlebird-api.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name castlebird-api.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/castlebird-api.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/castlebird-api.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
